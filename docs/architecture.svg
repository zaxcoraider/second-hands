<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d6168"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #dcdcd7; stroke-width: 1.5; }
      .inset { fill: #efefec; stroke: #dcdcd7; stroke-width: 1; }
      .model { fill: #eaf2fb; stroke: #0b6bcb; stroke-width: 1.5; }
      .code { fill: #ffffff; stroke: #8a8f96; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .stop { fill: #fdeceb; stroke: #c62828; stroke-width: 1.5; }
      .h { font-size: 15px; font-weight: 600; fill: #141518; }
      .t { font-size: 13px; fill: #141518; }
      .m { font-size: 12px; fill: #5d6168; }
      .mono { font-family: JetBrains Mono, ui-monospace, Menlo, monospace; font-size: 11px; fill: #5d6168; letter-spacing: 0.5px; }
      .ln { stroke: #5d6168; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f6f6f4"/>

  <!-- Clients -->
  <text x="40" y="38" class="mono">CLIENTS</text>
  <rect x="40" y="52" width="340" height="110" rx="10" class="box"/>
  <text x="60" y="80" class="h">Phone above the bench</text>
  <text x="60" y="102" class="t">/cam · rear camera, change detector,</text>
  <text x="60" y="120" class="t">JPEG 768 px, one request in flight</text>
  <text x="60" y="144" class="m">Speaks events · “I’m right” override</text>

  <rect x="430" y="52" width="340" height="110" rx="10" class="box"/>
  <text x="450" y="80" class="h">Laptop dashboard</text>
  <text x="450" y="102" class="t">/start → /bench → /report</text>
  <text x="450" y="120" class="t">Checklist, evidence, agent trace</text>
  <text x="450" y="144" class="m">Polls session state every second</text>

  <rect x="820" y="52" width="340" height="110" rx="10" class="box"/>
  <text x="840" y="80" class="h">Judge path</text>
  <text x="840" y="102" class="t">/try · sample clip through the</text>
  <text x="840" y="120" class="t">same capture code and pipeline</text>
  <text x="840" y="144" class="m">Recorded replay if over budget</text>

  <path d="M210 162 V 206" class="ln" marker-end="url(#a)"/>
  <text x="220" y="190" class="mono">POST /api/frame</text>
  <path d="M600 162 V 206" class="ln" marker-end="url(#a)"/>
  <text x="610" y="190" class="mono">/api/guide · /api/session</text>
  <path d="M990 162 V 206" class="ln" marker-end="url(#a)"/>
  <text x="1000" y="190" class="mono">/api/try · /api/frame</text>

  <!-- Server -->
  <rect x="40" y="210" width="1120" height="390" rx="12" class="inset"/>
  <text x="60" y="238" class="mono">NEXT.JS API ROUTES ON VERCEL</text>

  <!-- Guide pipeline -->
  <text x="60" y="272" class="h">1 · Guide builder</text>
  <rect x="60" y="284" width="190" height="56" rx="8" class="box"/>
  <text x="76" y="308" class="t">Tavily search</text>
  <text x="76" y="326" class="m">real repair guides</text>
  <path d="M250 312 H 282" class="ln" marker-end="url(#a)"/>
  <rect x="286" y="284" width="190" height="56" rx="8" class="box"/>
  <text x="302" y="308" class="t">Tavily extract</text>
  <text x="302" y="326" class="m">full page text</text>
  <path d="M476 312 H 508" class="ln" marker-end="url(#a)"/>
  <rect x="512" y="284" width="250" height="56" rx="8" class="model"/>
  <text x="528" y="308" class="t">Nemotron 3 Super 120B</text>
  <text x="528" y="326" class="m">guide → camera-checkable steps</text>
  <path d="M762 312 H 794" class="ln" marker-end="url(#a)"/>
  <rect x="798" y="284" width="190" height="56" rx="8" class="code"/>
  <text x="814" y="308" class="t">zod-validated Guide</text>
  <text x="814" y="326" class="m">user edits, then starts</text>

  <!-- Frame pipeline -->
  <text x="60" y="380" class="h">2 · Every frame</text>
  <rect x="60" y="392" width="200" height="66" rx="8" class="model"/>
  <text x="76" y="416" class="t">Nemotron 3.5 Super VL</text>
  <text x="76" y="434" class="m">frame + current step →</text>
  <text x="76" y="450" class="m">observation JSON</text>
  <path d="M260 425 H 292" class="ln" marker-end="url(#a)"/>
  <rect x="296" y="392" width="200" height="66" rx="8" class="code"/>
  <text x="312" y="416" class="t">Confirm (plain code)</text>
  <text x="312" y="434" class="m">same mistake in 2 of 3</text>
  <text x="312" y="450" class="m">frames · overrides · cooldown</text>
  <path d="M496 425 H 528" class="ln" marker-end="url(#a)"/>
  <rect x="532" y="392" width="200" height="66" rx="8" class="model"/>
  <text x="548" y="416" class="t">Nemotron 3 Nano 30B</text>
  <text x="548" y="434" class="m">warn · ask · stay silent;</text>
  <text x="548" y="450" class="m">writes the ≤15-word line</text>
  <path d="M732 425 H 764" class="ln" marker-end="url(#a)"/>
  <rect x="768" y="392" width="200" height="66" rx="8" class="model"/>
  <text x="784" y="416" class="t">Nemotron 3 Ultra 550B</text>
  <text x="784" y="434" class="m">high severity only: verifies</text>
  <text x="784" y="450" class="m">evidence (reasoning on)</text>
  <path d="M968 425 H 1000" class="ln" marker-end="url(#a)"/>
  <rect x="1004" y="392" width="136" height="66" rx="8" class="stop"/>
  <text x="1020" y="416" class="t">STOP event</text>
  <text x="1020" y="434" class="m">unconfirmed →</text>
  <text x="1020" y="450" class="m">downgrade to ask</text>
  <text x="296" y="482" class="m">Steps advance the same way: “done” in 2 of the last 3 frames.</text>

  <!-- Report -->
  <text x="60" y="524" class="h">3 · Report</text>
  <rect x="60" y="536" width="250" height="48" rx="8" class="model"/>
  <text x="76" y="565" class="t">Super 120B · session summary</text>
  <rect x="330" y="536" width="420" height="48" rx="8" class="box"/>
  <text x="346" y="565" class="t">Every call traced: stage, model, ms, tokens, $</text>
  <rect x="770" y="536" width="370" height="48" rx="8" class="box"/>
  <text x="786" y="565" class="t">Per-IP limits · daily budget · 5-min live cap</text>

  <!-- Services -->
  <path d="M300 600 V 640" class="ln" marker-end="url(#a)"/>
  <path d="M700 600 V 640" class="ln" marker-end="url(#a)"/>
  <path d="M1000 600 V 640" class="ln" marker-end="url(#a)"/>
  <rect x="40" y="644" width="520" height="80" rx="10" class="model"/>
  <text x="60" y="674" class="h">Nebius Token Factory</text>
  <text x="60" y="696" class="t">OpenAI-compatible API · 4 NVIDIA Nemotron models</text>
  <text x="60" y="712" class="m">Super VL · Nano 30B · Super 120B · Ultra 550B</text>
  <rect x="590" y="644" width="250" height="80" rx="10" class="box"/>
  <text x="610" y="674" class="h">Tavily</text>
  <text x="610" y="696" class="t">search + extract at runtime</text>
  <rect x="870" y="644" width="290" height="80" rx="10" class="box"/>
  <text x="890" y="674" class="h">Upstash Redis</text>
  <text x="890" y="696" class="t">sessions, events, trace,</text>
  <text x="890" y="712" class="t">thumbnails, rate limits</text>
</svg>
