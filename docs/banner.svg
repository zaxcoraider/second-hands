<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a52" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a52" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" fill="#0e0f11"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Left: wordmark -->
  <text x="72" y="92" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3" fill="#9aa0a6">PHYSICAL AI · REPAIR ASSISTANT</text>
  <text x="70" y="176" font-size="76" font-weight="600" fill="#ecedee" letter-spacing="-2">Second Hands</text>
  <text x="72" y="228" font-size="26" fill="#9aa0a6">An AI that watches your hands</text>
  <text x="72" y="264" font-size="26" fill="#9aa0a6">and stops you before you break something.</text>

  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="13" fill="#9aa0a6">
    <rect x="72" y="310" width="154" height="34" rx="17" fill="none" stroke="#2a2e33"/>
    <text x="92" y="332">Nemotron × 4</text>
    <rect x="238" y="310" width="164" height="34" rx="17" fill="none" stroke="#2a2e33"/>
    <text x="258" y="332">Token Factory</text>
    <rect x="414" y="310" width="98" height="34" rx="17" fill="none" stroke="#2a2e33"/>
    <text x="434" y="332">Tavily</text>
    <rect x="524" y="310" width="148" height="34" rx="17" fill="none" stroke="#2a2e33"/>
    <text x="544" y="332">any phone</text>
  </g>

  <!-- Right: the phone above the bench, mid-catch -->
  <circle cx="1010" cy="210" r="230" fill="url(#glow)"/>
  <rect x="860" y="40" width="300" height="340" rx="28" fill="#17191c" stroke="#ff5a52" stroke-width="8"/>
  <rect x="884" y="64" width="252" height="292" rx="14" fill="#1b2a22"/>
  <!-- board -->
  <rect x="910" y="92" width="200" height="110" rx="8" fill="#1f5130"/>
  <rect x="920" y="214" width="180" height="120" rx="6" fill="#4b5560"/>
  <rect x="984" y="196" width="40" height="16" rx="3" fill="#d0a640"/>
  <rect x="1060" y="120" width="40" height="16" rx="3" fill="#d0a640"/>
  <line x1="1080" y1="128" x2="1150" y2="200" stroke="#e6e2d8" stroke-width="7" stroke-linecap="round"/>
  <!-- step chip -->
  <rect x="896" y="76" width="228" height="30" rx="8" fill="#000000" fill-opacity="0.7"/>
  <text x="910" y="96" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1" fill="#9aa0a6">STEP 4 / 8</text>
  <text x="1018" y="96" font-size="12" font-weight="600" fill="#ff5a52">● STOP</text>
  <!-- spoken line -->
  <rect x="896" y="240" width="228" height="96" rx="10" fill="#000000" fill-opacity="0.82" stroke="#ff5a52" stroke-width="2"/>
  <text x="912" y="266" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" fill="#ff5a52">STOP · VERIFIED</text>
  <text x="912" y="292" font-size="19" font-weight="600" fill="#ecedee">Disconnect the</text>
  <text x="912" y="317" font-size="19" font-weight="600" fill="#ecedee">battery first.</text>
</svg>
